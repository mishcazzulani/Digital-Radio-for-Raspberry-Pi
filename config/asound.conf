# Digital Radio dsnoop (installed by install.sh)
# Shared capture device: lets the live stream and the recorder
# open the I2S capture at the same time.
pcm.dabdsnoop {
    type dsnoop
    ipc_key 8192
    ipc_key_add_uid yes
    slave {
        pcm "hw:1,0"
        format S16_LE
        rate 48000
        channels 2
    }
}
